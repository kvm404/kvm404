name: Refresh profile stats

on:
  schedule:
    - cron: "23 1 * * *" # 06:53 IST, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PROFILE_STATS_TOKEN is optional. Without it the default token only sees
      # public repos, so private ones drop out of the language and repo totals.
      - name: Render cards
        run: python3 scripts/render.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Commit if anything changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile stats"
          git push
