<svg xmlns="http://www.w3.org/2000/svg" width="490" height="210" viewBox="0 0 490 210" role="img" aria-label="4,500 contributions, 373 merged pull requests, 55 repositories.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#4C1D95"/><stop offset="0.33" stop-color="#9333EA"/><stop offset="0.67" stop-color="#DB2777"/><stop offset="1.00" stop-color="#F97316"/></linearGradient><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#4C1D95"/><stop offset="0.33" stop-color="#9333EA"/><stop offset="0.67" stop-color="#DB2777"/><stop offset="1.00" stop-color="#F97316"/></linearGradient></defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #e6edf3; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #9198a1; }
    .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #9198a1; }
    .in { animation: in 700ms cubic-bezier(.16,1,.3,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .ring { animation: ring 1.4s cubic-bezier(.16,1,.3,1) 300ms both; }@keyframes ring { from { stroke-dasharray: 0 339.3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="489" height="209" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="24" y="26" width="4" height="16" rx="2" fill="url(#gv)"/>
  <text class="title" x="36" y="39">GitHub at a glance</text>
  <g class="in" style="animation-delay:0ms"><circle cx="30" cy="71.5" r="3.5" fill="#4C1D95"/><text class="label" x="44" y="76">Contributions, all time</text><text class="value" x="300" y="76" text-anchor="end">4,500</text></g><g class="in" style="animation-delay:90ms"><circle cx="30" cy="97.5" r="3.5" fill="#9333EA"/><text class="label" x="44" y="102">Pull requests merged</text><text class="value" x="300" y="102" text-anchor="end">373</text></g><g class="in" style="animation-delay:180ms"><circle cx="30" cy="123.5" r="3.5" fill="#DB2777"/><text class="label" x="44" y="128">Repositories</text><text class="value" x="300" y="128" text-anchor="end">55</text></g><g class="in" style="animation-delay:270ms"><circle cx="30" cy="149.5" r="3.5" fill="#F97316"/><text class="label" x="44" y="154">Longest streak</text><text class="value" x="300" y="154" text-anchor="end">39 days</text></g><g class="in" style="animation-delay:360ms"><circle cx="30" cy="175.5" r="3.5" fill="#F97316"/><text class="label" x="44" y="180">Busiest day</text><text class="value" x="300" y="180" text-anchor="end">67 contributions</text></g><circle cx="395" cy="118" r="54" fill="none" stroke="#21262d" stroke-width="10"/><circle class="ring" cx="395" cy="118" r="54" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="120.9 339.3" transform="rotate(-90 395 118)"/><text x="395" y="122" text-anchor="middle" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:800" fill="#e6edf3">1,603</text><text class="mono" x="395" y="140" text-anchor="middle">IN 2026</text>
</svg>
