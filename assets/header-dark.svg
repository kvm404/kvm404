<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Kumar Vaibhav. Fullstack developer, AI and data science, IIT Madras.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; letter-spacing: 2.5px; fill: #9C9892; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 112px; letter-spacing: -5px; fill: #F5F2ED; }
    .slide { animation: slide 900ms cubic-bezier(.16,1,.3,1) both; }
    .rule { transform-origin: 48px 0; animation: grow 1100ms cubic-bezier(.45,0,.15,1) 500ms both; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .fade { animation: fadein 1200ms ease-out both; }
    @keyframes fadein { from { opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-28px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .slide, .rule, .dot, .fade { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="999" height="329" rx="10" fill="#000000" stroke="#282828"/>
  <text class="mono" x="48" y="52">KVM404 / README.MD</text>
  <g class="fade" style="animation-delay:350ms">
    <rect x="788" y="48" width="176" height="220" fill="#FF5B2A" fill-opacity=".18"/>
    <image href="data:image/webp;base64," x="776" y="36" width="176" height="220" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g class="slide" style="animation-delay:80ms"><text class="name" x="42" y="158" font-weight="300">KUMAR</text></g>
  <g class="slide" style="animation-delay:220ms"><text class="name" x="42" y="252" font-weight="800">VAIBHAV</text></g>
  <rect class="rule" x="48" y="276" width="904" height="3" fill="#FF5B2A"/>
  <text class="mono" x="48" y="306">FULLSTACK DEVELOPER · AI/DS · IIT MADRAS</text>
  <circle class="dot" cx="764" cy="301" r="4.5" fill="#FF5B2A"/>
  <text class="mono" x="952" y="306" text-anchor="end" fill="#D6D2CC">OPEN TO WORK</text>
</svg>
