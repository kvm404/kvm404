<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-label="Kumar Vaibhav, fullstack developer. 4,525 contributions, 381 merged pull requests, 56 repositories, 39 day longest streak.">
  <style>
    .label { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 1.6px; fill: #8b96a5; }
    .h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.8px; fill: #f1f5f9; }
    .big { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -1.8px; fill: #f1f5f9; }
    .unit { font-size: 18px; font-weight: 600; letter-spacing: 0; fill: #8b96a5; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b96a5; }
    .strong { font-weight: 700; fill: #f1f5f9; }
    .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b96a5; }
    .tick { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #8b96a5; }
    .num { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .chip { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #f1f5f9; }
    .ringtxt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
    .tile { animation: tile 700ms cubic-bezier(.16,1,.3,1) both; }
    .draw { stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.45,0,.15,1) 400ms both; }
    .ring { animation: ring 1.4s cubic-bezier(.16,1,.3,1) 400ms both; }
    .grow { animation: grow 1s cubic-bezier(.16,1,.3,1) 500ms both; }
    .rise { animation: rise 900ms cubic-bezier(.16,1,.3,1) 400ms both; }
    .pop { animation: pop 600ms cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes tile { from { opacity: 0; transform: translateY(10px); } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes ring { from { stroke-dasharray: 0 188.5; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes rise { from { transform: scaleY(0); } }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .tile, .draw, .ring, .grow, .rise, .pop, .pulse { animation: none; } }
  </style>
