  <style>
    .back { animation: drift 14s linear infinite; }
    .front { animation: drift 9s linear infinite reverse; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 60px; font-weight: 800; letter-spacing: -1.5px; fill: #fff; }
    .sub { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 3px; fill: #fff; fill-opacity: .85; }
    .in { animation: up 1s cubic-bezier(.16,1,.3,1) both; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { .back, .front, .in { animation: none; } }
  </style>
