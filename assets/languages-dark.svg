<svg xmlns="http://www.w3.org/2000/svg" width="490" height="210" viewBox="0 0 490 210" role="img" aria-label="Language split: TypeScript 58%, Python 12%, JavaScript 9%, Kotlin 8%, Go 4%, Other 8%">
